name: chatdesk-dev

# Backing services for local development — run the app itself with
# `npm run dev`:
#
#   docker compose -f docker-compose.dev.yml up -d
#   npm run db:migrate
#   npm run dev
#
# Matches the defaults in .env.local.example. Use a throwaway database
# for tests: TEST_DATABASE_URL=postgresql://chatdesk:chatdesk@localhost:5432/chatdesk_test
# (create it once with: docker compose -f docker-compose.dev.yml exec db
#  createdb -U chatdesk chatdesk_test).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chatdesk
      POSTGRES_PASSWORD: chatdesk
      POSTGRES_DB: chatdesk
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  storage:
    image: chrislusf/seaweedfs:3.85
    # S3-compatible object store. Writes its S3 credentials file from
    # the environment, then runs a single-node server (master + volume +
    # filer + S3 gateway). Anonymous requests are refused.
    entrypoint:
      - sh
      - -c
      - >-
        printf '{"identities":[{"name":"chatdesk","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: chatdesk
      S3_SECRET_KEY: chatdesk-dev-secret
    ports:
      - '9000:8333'
    volumes:
      - storage-data:/data

  # Catches outgoing email (password resets) — browse it at
  # http://localhost:8025. Point SMTP_HOST=localhost, SMTP_PORT=1025.
  mail:
    image: axllent/mailpit:v1.24
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  db-data:
  storage-data:
